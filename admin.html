<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Məktəb-Lisey — Admin</title>
<style>
:root{--bg:#111b21;--card:#202c33;--pri:#00a884;--tx:#e9edef;--mut:#8696a0;--bd:#2a3942;--red:#f15c6d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:900px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
a{color:var(--pri);text-decoration:none}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button,select,input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font-size:15px;outline:none}
.tabs button{cursor:pointer}.tabs button.on{background:var(--pri);color:#111b21;border-color:var(--pri);font-weight:700}
input{width:100%;margin-bottom:10px}
.row{background:var(--card);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0;word-break:break-word}
.s{font-size:12px;color:var(--mut)}
.row button{border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;background:var(--red);color:#fff}
.row button.ok{background:var(--pri);color:#111b21}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);margin-left:6px}
.tag.red{background:var(--red);color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<header><h2>🛡 Admin panel</h2><a href="chat.html">← Çata qayıt</a></header>
<div class="tabs">
  <button id="t-users" class="on">İstifadəçilər</button>
  <button id="t-msgs">Mesajlar</button>
  <button id="t-rep">Şikayətlər</button>
</div>

<div id="v-users">
  <div class="s" id="stats" style="margin-bottom:8px"></div>
  <input id="q" placeholder="Ad, istifadəçi adı və ya sinif üzrə axtar...">
  <div id="users"></div>
</div>

<div id="v-msgs" class="hidden">
  <select id="room" style="margin-bottom:10px">
    <option value="general">Ümumi Söhbət</option>
    <option value="az_sector">Azərbaycan Sektoru</option>
    <option value="ru_sector">Rus Sektoru</option>
  </select>
  <div id="msgs"></div>
</div>

<div id="v-rep" class="hidden"><div id="reps"></div></div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { collection, query, where, orderBy, limit, onSnapshot, doc, getDoc, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let users = [], unsub;

// Проверка авторизации через localStorage (вместо Firebase Auth u.uid)
window.addEventListener('DOMContentLoaded', async () => {
    const currentUsername = localStorage.getItem('my_application_id');
    if (!currentUsername) {
        window.location.href = 'login.html';
        return;
    }

    try {
        const userRef = doc(db, 'users', currentUsername);
        const s = await getDoc(userRef);
        
        if (!s.exists()) {
            window.location.href = 'login.html';
            return;
        }

        // Загружаем данные админ-панели для любого вошедшего пользователя
        loadUsers(); 
        loadMsgs(); 
        loadReports();

    } catch (e) {
        console.error("Xəta:", e);
        window.location.href = 'login.html';
    }
});

function show(tab) {
  ['users', 'msgs', 'rep'].forEach(k => { $('v-' + k).classList.toggle('hidden', tab !== k); $('t-' + k).classList.toggle('on', tab === k); });
}
['users', 'msgs', 'rep'].forEach(k => $('t-' + k).onclick = () => show(k));

async function loadUsers() {
  users = (await getDocs(collection(db, 'users'))).docs.map(d => ({ id: d.id, ...d.data() }));
  renderUsers();
}
$('q').oninput = renderUsers;

function renderUsers() {
  const q = $('q').value.trim().toLowerCase(), box = $('users');
  box.textContent = '';
  $('stats').textContent = `Cəmi: ${users.length} • Azərbaycan: ${users.filter(u => u.sector === 'az').length} • Rus: ${users.filter(u => u.sector === 'ru').length} • Bloklu: ${users.filter(u => u.banned).length}`;
  users.filter(u => `${u.name} ${u.username} ${u.schoolClass}`.toLowerCase().includes(q)).forEach(u => {
    const row = h('div', 'row'), info = h('div', 'grow'), name = h('div', null, u.name);
    if (u.role === 'admin') name.append(h('span', 'tag', 'admin'));
    if (u.banned) name.append(h('span', 'tag red', 'bloklu'));
    info.append(name, h('div', 's', `@${u.username} • ${u.schoolClass} • ${u.sector === 'az' ? 'Az' : 'Rus'}`));
    row.append(info);
    if (u.role !== 'admin') {
      const b = h('button', u.banned ? 'ok' : '', u.banned ? 'Blokdan çıxar' : 'Blokla');
      b.onclick = async () => {
        if (!confirm(`${u.name} ${u.banned ? 'blokdan çıxarılsın' : 'bloklansın'}?`)) return;
        try { await updateDoc(doc(db, 'users', u.id), { banned: !u.banned }); u.banned = !u.banned; renderUsers(); }
        catch (e) { alert('Xəta: ' + e.message); }
      };
      row.append(b);
    }
    box.append(row);
  });
}

function loadMsgs() {
    unsub && unsub();
    const q = query(collection(db, 'messages'), where('room', '==', $('room').value), orderBy('createdAt', 'desc'), limit(100));
    unsub = onSnapshot(q, snap => {
        const box = $('msgs'); box.textContent = '';
        if (!snap.size) box.append(h('div', 's', 'Mesaj yoxdur.'));
        snap.forEach(d => {
            const m = d.data(), row = h('div', 'row'), info = h('div', 'grow');
            
            let t = '';
            if (m.createdAt) {
                t = typeof m.createdAt.toDate === 'function' ? m.createdAt.toDate().toLocaleString() : new Date(m.createdAt).toLocaleString();
            }

            info.append(h('div', 's', `${m.name} (@${m.username}) • ${t}`), h('div', null, m.text));
            const b = h('button', null, 'Sil');
            b.onclick = () => confirm('Mesaj silinsin?') && deleteDoc(d.ref);
            row.append(info, b); box.append(row);
        });
    }, err => { $('msgs').textContent = 'Xəta: ' + err.message; });
}
$('room').onchange = loadMsgs;

function loadReports() {
  onSnapshot(query(collection(db, 'reports'), orderBy('createdAt', 'desc'), limit(100)), snap => {
    const box = $('reps'); box.textContent = '';
    $('t-rep').textContent = 'Şikayətlər' + (snap.size ? ` (${snap.size})` : '');
    if (!snap.size) box.append(h('div', 's', 'Şikayət yoxdur.'));
    snap.forEach(d => {
      const r = d.data({ serverTimestamps: 'estimate' }), row = h('div', 'row'), info = h('div', 'grow');
      info.append(h('div', null, `${r.reporterName} → ${r.targetName} (@${r.targetUsername})`), h('div', null, 'Səbəb: ' + r.reason));
      if (r.msgText) info.append(h('div', 's', 'Mesaj: ' + r.msgText));
      const ban = h('button', null, 'Blokla');
      ban.onclick = async () => { if (confirm(r.targetName + ' bloklansın?')) { try { await updateDoc(doc(db, 'users', r.target), { banned: true }); alert('Bloklandı'); } catch (e) { alert(e.message); } } };
      const cl = h('button', 'ok', 'Bağla'); cl.onclick = () => deleteDoc(d.ref);
      row.append(info, ban, cl); box.append(row);
    });
  }, e => { $('reps').textContent = 'Xəta: ' + e.message; });
}
</script>
</body>
</html>
